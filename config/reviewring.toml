# ReviewRing tunables. Every (tunable) default from the spec lives here.
# A gitignored data/config.toml can override any key locally.

[budget]
monthly_cap = 250            # free plan
hourly_cap = 50              # free plan, rolling 60 minutes
per_analysis_cap = 32
retry_delay_seconds = 30     # 5xx / timeout: retry once after this, then pause
request_timeout_seconds = 60

[collection]
n_reviews = 88               # newest target reviews: 8 + 4 x 20
k1 = 8                       # round-1 reviewers
baseline = 2                 # B: random baseline reviewers
k2 = 15                      # round-2 reviewers
history_concurrency = 3
seed = 20261010

[resolve]
short_link_timeout_seconds = 10
short_link_max_redirects = 10
name_search_candidates = 5
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"

[priority]
in_burst = 3
rating_matches_direction = 2
thin_reviewer = 2            # reviewer has <= thin_reviews_max total reviews
thin_reviews_max = 5
zero_photos = 1
short_text = 1
duplicate_cluster = 2
local_guide = 0
round2_near_days = 3
round2_bonus = 2
batch_points = 2             # review posted with >= batch_min_others other 5-star reviews within +-24 h
batch_window_hours = 24
batch_min_others = 2

[text]
ngram = 3
near_duplicate_similarity = 0.65
near_duplicate_min_chars = 30
short_max_chars = 40
stock_phrase_min_accounts = 10
stock_phrase_max_connected_share = 0.20
stock_phrase_min_checked = 3   # below this many checked users, a stock phrase is undetermined (kept as evidence)

[bursts]
min_reviews = 10
min_span_days = 2
window_days = 3
window_min_reviews = 5
poisson_p = 0.001
direction_share = 0.90
max_rounds = 3
negative_bursts = true

[single_use]
# A burst made mostly of accounts that have reviewed nothing else: the cheapest kind of bought review.
max_reviews = 1              # an account showing at most this many reviews is "single-use"
min_in_burst = 5
min_share = 0.6
raises_level = true          # a flagged burst makes the level at least Elevated (never High)

[young]
min_total_reviews = 50
short_span_days = 30
short_span_max_total = 200

[surprise]
near_km = 5
mid_km = 50
near_factor = 0.2
mid_factor = 0.5
far_factor = 1.0
no_coords_factor = 0.5
popular_factor = 0.1
other_factor = 1.0
popular_last_words = [
  "attraction", "airport", "station", "mall", "park", "temple", "mosque",
  "church", "cathedral", "gurudwara", "gurdwara", "shrine", "dargah",
  "monument", "landmark", "museum", "fort", "palace", "stadium", "beach",
  "lake", "zoo", "university", "worship", "ashram", "ghat", "garden", "memorial", "waterfall", "viewpoint",
  "aquarium", "planetarium", "stupa", "basilica", "monastery", "synagogue", "cave", "hill",
]
popular_exclusions = ["police station", "fire station"]

[edges]
min_weight = 2.0
min_non_popular_shared = 2
# [max precision days, coincidence c] checked in order
timing = [[2, 1.0], [14, 0.6], [60, 0.2]]

[groups]
louvain_min_size = 8
louvain_max_density = 0.5
prune_min_edges = 2
prune_share = 0.30
core_min_members = 3
core_share = 0.30
far_km = 50
episode_precision_days = 14
episode_gap_days = 21
trip_max_span_km = 600
trip_min_travel_share = 0.75     # at most a quarter of core places may be non-travel (an emporium, a pharmacy)
trip_travel_groups = ["family", "friends", "couple"]   # hotel review details that count as trip evidence
trip_requires_positive_evidence = true   # false = the old rule (ruled out on 2 of 3 indicators alone); for ablation
social_min_member_share = 0.5    # social circle: at least half the members share a home area...
social_min_core_share = 0.5      # ...and at least half the core places are near it
social_km = 50
trip_concentration_below = 0.3
trip_five_star_share_below = 0.9
trip_indicators_needed = 2
ring_min_size = 4
ring_min_density = 0.5
ring_min_core_places = 2
ring_min_far_areas = 2
possible_ring_min_size = 3

[confidence]
density = 0.20
core_places = 0.15
core_places_full = 6
dispersion = 0.15
far_areas_full = 4
type_diversity = 0.10
type_groups_full = 4
concentration = 0.15
concentration_full = 0.3
timing = 0.15
member_signals = 0.10
member_signals_min = 2

[signals]
thin_max_reviews = 5
thin_max_level = 2
monotony_min_reviews = 10
monotony_share = 0.95
multi_city_days = 7
multi_city_min_areas = 3
multi_city_min_km = 300
same_day_min_occasions = 2
same_day_min_km = 500
short_text_share = 0.60

[level]
high_confidence = 0.7
high_ring_share = 0.10
elevated_suspicious_share = 0.15

[areas]
cluster_radius_km = 50

[homes]
# A reviewer's home area: the most common area among places no other checked reviewer reviewed.
min_personal_places = 3
min_mode_count = 2
min_mode_share = 0.4

[llm]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"     # checked against api-docs.deepseek.com on 2026-09-29
max_tokens = 1200
timeout_seconds = 60
temperature = 0
paraphrase_signal = false    # A8, off by default

[server]
host = "127.0.0.1"
port = 8765
dev_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

[geo]
# 28 states and 8 union territories, for finding the city in Indian addresses.
states = [
  "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chhattisgarh", "Goa", "Gujarat", "Haryana",
  "Himachal Pradesh", "Jharkhand", "Karnataka", "Kerala", "Madhya Pradesh", "Maharashtra", "Manipur",
  "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana",
  "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal",
]
union_territories = [
  "Andaman and Nicobar Islands", "Chandigarh", "Dadra and Nagar Haveli and Daman and Diu", "Delhi",
  "Jammu and Kashmir", "Ladakh", "Lakshadweep", "Puducherry",
]
# Older or alternative spellings seen in addresses.
state_aliases = { "Orissa" = "Odisha", "Pondicherry" = "Puducherry", "NCT of Delhi" = "Delhi", "National Capital Territory of Delhi" = "Delhi", "Uttaranchal" = "Uttarakhand", "Jammu & Kashmir" = "Jammu and Kashmir", "Andaman & Nicobar Islands" = "Andaman and Nicobar Islands" }
# One metro never counts as several cities.
metros = [
  ["Delhi NCR", "Delhi", "New Delhi", "Gurugram", "Gurgaon", "Noida", "Greater Noida", "Ghaziabad", "Faridabad"],
  ["Mumbai", "Mumbai", "Thane", "Navi Mumbai", "Kalyan", "Mira-Bhayandar", "Mira Bhayandar", "Vasai-Virar", "Vasai", "Virar"],
  ["Hyderabad", "Hyderabad", "Secunderabad"],
  ["Kolkata", "Kolkata", "Howrah", "Bidhannagar"],
  ["Pune", "Pune", "Pimpri-Chinchwad", "Pimpri Chinchwad"],
  ["Bengaluru", "Bengaluru", "Bangalore"],
  ["Chandigarh", "Chandigarh", "Mohali", "Sahibzada Ajit Singh Nagar", "Panchkula"],
  ["Ahmedabad", "Ahmedabad", "Gandhinagar"],
]
# Major cities, so the AI-summary validator catches stray place names even outside this analysis's areas.
major_cities = [
  "Agra", "Ahmedabad", "Ajmer", "Allahabad", "Prayagraj", "Amritsar", "Aurangabad", "Bhopal", "Bhubaneswar",
  "Chandigarh", "Chennai", "Coimbatore", "Cuttack", "Dehradun", "Dhanbad", "Durgapur", "Gangtok", "Goa", "Gwalior",
  "Guwahati", "Hubli", "Imphal", "Indore", "Jabalpur", "Jaipur", "Jalandhar", "Jammu", "Jamshedpur", "Jodhpur",
  "Kanpur", "Kochi", "Cochin", "Kolhapur", "Kota", "Kozhikode", "Lucknow", "Ludhiana", "Madurai", "Mangaluru",
  "Mangalore", "Meerut", "Mysuru", "Mysore", "Nagpur", "Nashik", "Panaji", "Patna", "Pondicherry", "Raipur",
  "Rajkot", "Ranchi", "Rishikesh", "Shillong", "Shimla", "Siliguri", "Solapur", "Srinagar", "Surat",
  "Thiruvananthapuram", "Trivandrum", "Tiruchirappalli", "Udaipur", "Vadodara", "Varanasi", "Vijayawada",
  "Visakhapatnam", "Vizag", "Warangal", "Manali", "Ooty", "Darjeeling", "Munnar", "Mussoorie", "Nainital",
]
country_short = { "United Arab Emirates" = "UAE", "United States" = "USA", "United Kingdom" = "UK" }

# Type groups (spec 9.6): whole-word, case-insensitive keywords matched against a place's type.
# First match wins; order matters. "travel" marks groups a trip would visit.
[[type_groups]]
name = "Lodging"
travel = true
keywords = ["hotel", "resort", "lodge", "guest house", "guesthouse", "homestay", "hostel", "inn", "dharamshala", "motel"]

[[type_groups]]
name = "Food & drink"
travel = true
keywords = ["restaurant", "cafe", "café", "bakery", "dhaba", "bar", "pub", "sweet shop", "food court", "caterer", "coffee shop", "ice cream shop"]

[[type_groups]]
name = "Tourist & religious"
travel = true
keywords = ["attraction", "temple", "mosque", "church", "gurudwara", "gurdwara", "monument", "museum", "fort", "palace", "park", "beach", "lake", "zoo", "shrine", "dargah", "ashram", "place of worship", "ghat", "garden", "waterfall", "viewpoint", "memorial"]

[[type_groups]]
name = "Event venue"
travel = true
keywords = ["banquet hall", "wedding venue", "marriage hall", "event venue", "convention center", "convention centre"]

[[type_groups]]
name = "Transport"
travel = true
