[[type_groups]]
name = "Beauty & wellness"
travel = false
keywords = ["salon", "spa", "parlour", "gym", "fitness"]

[[type_groups]]
name = "Auto"
travel = false
keywords = ["car", "bike", "motorcycle", "dealer", "garage", "service center"]
