# ReviewRing tunables. Every (tunable) default from the spec lives here.
# A gitignored data/config.toml can override any key locally.

[budget]
monthly_cap = 250            # free plan
hourly_cap = 50              # free plan, rolling 60 minutes
per_analysis_cap = 40        # 6 pages + 29 histories + 3 top-rated + 1 coordinates lookup + 1 spare
retry_delay_seconds = 30     # 5xx / timeout: retry once after this, then pause
request_timeout_seconds = 60

[collection]
n_reviews = 100              # newest target reviews: 6 pages (8 + 5 x 20 = 108), the newest 100 kept
k1 = 8                       # round-1 reviewers
baseline = 2                 # B: random baseline reviewers
k2 = 15                      # round-2 reviewers
voice_picks = 0              # extra round-1 histories for the voice check (off: see [voice])
history_concurrency = 3
seed = 20261010

[resolve]
short_link_timeout_seconds = 10
short_link_max_redirects = 10
name_search_candidates = 5
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36"

[priority]
in_burst = 3
rating_matches_direction = 2
thin_reviewer = 2            # reviewer has <= thin_reviews_max total reviews
thin_reviews_max = 5
zero_photos = 1
short_text = 1
duplicate_cluster = 2
local_guide = 0
round2_near_days = 3
round2_bonus = 2
batch_points = 2             # review posted with >= batch_min_others other 5-star reviews within +-24 h
batch_window_hours = 24
batch_min_others = 2

[text]
ngram = 3
near_duplicate_similarity = 0.65
near_duplicate_min_chars = 30
short_max_chars = 40
stock_phrase_min_accounts = 10
stock_phrase_max_connected_share = 0.20
stock_phrase_min_checked = 3   # below this many checked users, a stock phrase is undetermined (kept as evidence)

[bursts]
min_reviews = 10
min_span_days = 2
window_days = 3
window_min_reviews = 5
poisson_p = 0.001
direction_share = 0.90
max_rounds = 3
negative_bursts = true

[single_use]
max_reviews = 1              # an account showing at most this many reviews is "single-use" (reported, never required)

[review_burst]
# A burst of same-star reviews: many 5-star reviews (bought praise) or 1-star reviews (an attack) packed into a few
# hours or days. Only reviews of that rating count; whose accounts they are doesn't matter. Exact timestamps.
max_span_hours = 72          # the stretch searched: at most 3 days
max_gap_hours = 12           # a review more than 12 hours from the rest, at either end, isn't part of the burst
min_share = 0.25             # it must hold at least a quarter of the reviews examined...
min_count = 8                # ...and at least this many
min_pace = 10                # ...arriving at least 10x faster than the listing's other reviews (busy places get many)
min_others = 5               # with fewer other reviews, the usual pace is unknown and nothing is flagged
core_share = 0.8             # also report the tightest stretch holding this share of the burst ("34 in 37 minutes")
max_rounds = 2               # a second burst of the same rating is looked for after the first
raises_level = true          # a flagged burst makes the level at least Elevated (never High)

[rating_gap]
# When the displayed rating sits far above the newest reviews, the older mass of reviews carries it.
min_gap = 0.8                # displayed rating minus the recent average, in stars
min_total_ratio = 5          # only when the total is at least 5x the reviews examined
top_rated_pages = 3          # then sample the highest-rated reviews: 3 searches (5-8 + 20 + 20 reviews)
cluster_months = 3           # report the busiest 3-month window among those top-rated reviews

[generated_text]
# Phrases no customer writes: chatbot replies and unfilled template placeholders pasted in as reviews.
markers = [
  "unable to generate", "can't generate a review", "cannot generate a review", "i can help you outline",
  "as an ai", "as a language model", "ai language model", "i don't have personal experience",
  "i do not have personal experience", "here's a review", "here is a review", "certainly! here",
  "sure! here", "[hotel name]", "[business name]", "[your name]", "[company name]", "[restaurant name]",
  "[clinic name]", "[insert",
]
raises_level = true          # a matched marker makes the level at least Elevated (never High)

[ai_text]
# An AI model's opinion on whether a review reads as AI-written. Off since 2026-10-08: it mostly singles out people
# who write in a second language and polish an honest review with AI, which is not a warning sign. Pasted chatbot
# replies are still caught by the deterministic "chatbot_text" sign. When on: only longer reviews are judged, and
# an "AI-written" opinion must quote at least min_cues phrases that are really in the review.
enabled = false
min_words = 40
batch_size = 12
max_chars = 1500             # per review sent
min_cues = 2

[signs]
# Per-review warning signs, strongest first. A review is drawn in the first branch that is set aside.
order = ["chatbot_text", "copied_text", "keyword_style", "review_burst", "linked_group", "review_spree", "names_area", "first_time_account"]
set_aside_by_default = ["chatbot_text", "copied_text", "keyword_style", "review_burst", "linked_group"]
first_time_max_reviews = 1   # an account showing at most this many reviews is "first-time"
skew_min_ratio = 2.0         # 5-star reviews this many times as likely to be first-time as other reviews...
skew_min_five_star = 10      # ...with at least this many 5-star and
skew_min_other = 5           # this many other reviews to compare
skew_min_share = 0.35        # and at least this share of the 5-star reviews (a fifth is normal for real customers)

[keyword_style]
# Reviews written like search ads: the business or its category, then its neighbourhood or city
# ("packers and movers in [area], [city]"). Counts only when several accounts at the listing write this way.
min_accounts = 3
min_share = 0.08             # of the reviews with text
min_ad_reviews = 2           # the level rises only with at least this many ad-like reviews, not just name-with-area ones
raises_level = true          # flagged: the level is at least Elevated (never High)
priority_points = 2          # open these reviewers' histories first, so their voice can be compared

[voice]
# Not in the reviewer's own voice: an AI model compared a checked reviewer's review of this business with their own
# other reviews. Off since 2026-10-08: on real data nearly every flag was wrong. Most "other reviews" are one-line
# notes about a restaurant or a salon, so the model read a change of topic and length as a different writer, and no
# prompt fixed it. Authorship needs far more of a person's writing than Google profiles show.
enabled = false
min_words_here = 12          # the review of this business needs this many words to compare
min_other_words = 3          # an other review counts as their writing with this many words
max_others = 5               # other reviews sent per reviewer
min_others = 2               # a reviewer needs this many other written reviews to compare
min_different_votes = 2      # a mismatch needs at least this many of their other reviews judged a different writer, and none the same
batch_size = 6               # reviewers per call
pick_min_words = 20          # a voice pick's review needs this many words...
pick_min_account_reviews = 3 # ...and its author at least this many reviews (some writing to compare)
raises_level_at = 0          # 0: never raises the level. On real data the AI's "different writer" calls were mostly wrong (2026-10-08)

[spree]
# A checked reviewer who rated many unrelated businesses in several cities within a month, almost all 5 stars:
# the shape of "rate and earn" tasks, though some travellers review this way too. Context, never counted.
window_days = 31
min_reviews = 8
min_areas = 3
min_five_star_share = 0.9
max_precision_days = 31

[young]
min_total_reviews = 50
short_span_days = 30
short_span_max_total = 200

[surprise]
near_km = 5
mid_km = 50
near_factor = 0.2
mid_factor = 0.5
far_factor = 1.0
no_coords_factor = 0.5
popular_factor = 0.1
other_factor = 1.0
popular_last_words = [
  "attraction", "airport", "station", "mall", "park", "temple", "mosque",
  "church", "cathedral", "gurudwara", "gurdwara", "shrine", "dargah",
  "monument", "landmark", "museum", "fort", "palace", "stadium", "beach",
  "lake", "zoo", "university", "worship", "ashram", "ghat", "garden", "memorial", "waterfall", "viewpoint",
  "aquarium", "planetarium", "stupa", "basilica", "monastery", "synagogue", "cave", "hill",
]
popular_exclusions = ["police station", "fire station"]

[edges]
min_weight = 2.0
min_non_popular_shared = 2
# [max precision days, coincidence c] checked in order
timing = [[2, 1.0], [14, 0.6], [60, 0.2]]

[groups]
louvain_min_size = 8
louvain_max_density = 0.5
prune_min_edges = 2
prune_share = 0.30
core_min_members = 3
core_share = 0.30
far_km = 50
episode_precision_days = 14
episode_gap_days = 21
trip_max_span_km = 600
trip_min_travel_share = 0.75     # at most a quarter of core places may be non-travel (an emporium, a pharmacy)
trip_travel_groups = ["family", "friends", "couple"]   # hotel review details that count as trip evidence
trip_requires_positive_evidence = true   # false = the old rule (ruled out on 2 of 3 indicators alone); for ablation
social_min_member_share = 0.5    # social circle: at least half the members share a home area...
social_min_core_share = 0.5      # ...and at least half the core places are near it
social_km = 50
trip_concentration_below = 0.3
trip_five_star_share_below = 0.9
trip_indicators_needed = 2
ring_min_size = 4
ring_min_density = 0.5
ring_min_core_places = 2
ring_min_far_areas = 2
possible_ring_min_size = 3

[confidence]
density = 0.20
core_places = 0.15
core_places_full = 6
dispersion = 0.15
far_areas_full = 4
type_diversity = 0.10
type_groups_full = 4
concentration = 0.15
concentration_full = 0.3
timing = 0.15
member_signals = 0.10
member_signals_min = 2

[signals]
thin_max_reviews = 5
thin_max_level = 2
monotony_min_reviews = 10
monotony_share = 0.95
multi_city_days = 7
multi_city_min_areas = 3
multi_city_min_km = 300
same_day_min_occasions = 2
same_day_min_km = 500
short_text_share = 0.60

[level]
high_confidence = 0.7
high_ring_share = 0.10
elevated_suspicious_share = 0.15

[areas]
cluster_radius_km = 50

[homes]
# A reviewer's home area: the most common area among places no other checked reviewer reviewed.
min_personal_places = 3
min_mode_count = 2
min_mode_share = 0.4

[llm]
base_url = "https://api.deepseek.com"
model = "deepseek-flash"     # checked against api-docs.deepseek.com on 2026-09-29
thinking = "disabled"        # deepseek-flash thinks by default; that spends the reply budget and returned empty JSON
max_tokens = 2000
timeout_seconds = 60
temperature = 0
paraphrase_signal = false    # A8, off by default

[server]
host = "127.0.0.1"
port = 8765
dev_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

[geo]
# 28 states and 8 union territories, for finding the city in Indian addresses.
states = [
  "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chhattisgarh", "Goa", "Gujarat", "Haryana",
  "Himachal Pradesh", "Jharkhand", "Karnataka", "Kerala", "Madhya Pradesh", "Maharashtra", "Manipur",
  "Meghalaya", "Mizoram", "Nagaland", "Odisha", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana",
  "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal",
]
union_territories = [
  "Andaman and Nicobar Islands", "Chandigarh", "Dadra and Nagar Haveli and Daman and Diu", "Delhi",
  "Jammu and Kashmir", "Ladakh", "Lakshadweep", "Puducherry",
]
# Older or alternative spellings seen in addresses.
state_aliases = { "Orissa" = "Odisha", "Pondicherry" = "Puducherry", "NCT of Delhi" = "Delhi", "National Capital Territory of Delhi" = "Delhi", "Uttaranchal" = "Uttarakhand", "Jammu & Kashmir" = "Jammu and Kashmir", "Andaman & Nicobar Islands" = "Andaman and Nicobar Islands" }
# One metro never counts as several cities.
metros = [
  ["Delhi NCR", "Delhi", "New Delhi", "Gurugram", "Gurgaon", "Noida", "Greater Noida", "Ghaziabad", "Faridabad"],
  ["Mumbai", "Mumbai", "Thane", "Navi Mumbai", "Kalyan", "Mira-Bhayandar", "Mira Bhayandar", "Vasai-Virar", "Vasai", "Virar"],
  ["Hyderabad", "Hyderabad", "Secunderabad"],
  ["Kolkata", "Kolkata", "Howrah", "Bidhannagar"],
  ["Pune", "Pune", "Pimpri-Chinchwad", "Pimpri Chinchwad"],
  ["Bengaluru", "Bengaluru", "Bangalore"],
  ["Chandigarh", "Chandigarh", "Mohali", "Sahibzada Ajit Singh Nagar", "Panchkula"],
  ["Ahmedabad", "Ahmedabad", "Gandhinagar"],
]
# Major cities, so the AI-summary validator catches stray place names even outside this analysis's areas.
major_cities = [
  "Agra", "Ahmedabad", "Ajmer", "Allahabad", "Prayagraj", "Amritsar", "Aurangabad", "Bhopal", "Bhubaneswar",
  "Chandigarh", "Chennai", "Coimbatore", "Cuttack", "Dehradun", "Dhanbad", "Durgapur", "Gangtok", "Goa", "Gwalior",
  "Guwahati", "Hubli", "Imphal", "Indore", "Jabalpur", "Jaipur", "Jalandhar", "Jammu", "Jamshedpur", "Jodhpur",
  "Kanpur", "Kochi", "Cochin", "Kolhapur", "Kota", "Kozhikode", "Lucknow", "Ludhiana", "Madurai", "Mangaluru",
  "Mangalore", "Meerut", "Mysuru", "Mysore", "Nagpur", "Nashik", "Panaji", "Patna", "Pondicherry", "Raipur",
  "Rajkot", "Ranchi", "Rishikesh", "Shillong", "Shimla", "Siliguri", "Solapur", "Srinagar", "Surat",
  "Thiruvananthapuram", "Trivandrum", "Tiruchirappalli", "Udaipur", "Vadodara", "Varanasi", "Vijayawada",
  "Visakhapatnam", "Vizag", "Warangal", "Manali", "Ooty", "Darjeeling", "Munnar", "Mussoorie", "Nainital",
]
country_short = { "United Arab Emirates" = "UAE", "United States" = "USA", "United Kingdom" = "UK" }

# Type groups (spec 9.6): whole-word, case-insensitive keywords matched against a place's type.
# First match wins; order matters. "travel" marks groups a trip would visit.
[[type_groups]]
name = "Lodging"
travel = true
keywords = ["hotel", "resort", "lodge", "guest house", "guesthouse", "homestay", "hostel", "inn", "dharamshala", "motel"]

[[type_groups]]
name = "Food & drink"
travel = true
keywords = ["restaurant", "cafe", "café", "bakery", "dhaba", "bar", "pub", "sweet shop", "food court", "caterer", "coffee shop", "ice cream shop"]

[[type_groups]]
name = "Tourist & religious"
travel = true
keywords = ["attraction", "temple", "mosque", "church", "gurudwara", "gurdwara", "monument", "museum", "fort", "palace", "park", "beach", "lake", "zoo", "shrine", "dargah", "ashram", "place of worship", "ghat", "garden", "waterfall", "viewpoint", "memorial"]

[[type_groups]]
name = "Event venue"
travel = true
keywords = ["banquet hall", "wedding venue", "marriage hall", "event venue", "convention center", "convention centre"]

[[type_groups]]
name = "Transport"
travel = true
keywords = ["airport", "station", "bus", "taxi", "travel agency"]

[[type_groups]]
name = "Health"
travel = false
keywords = ["clinic", "hospital", "dentist", "dental", "doctor", "physiotherapist", "pharmacy", "diagnostic", "ivf", "transplant", "surgeon", "medical"]

[[type_groups]]
name = "Education"
travel = false
keywords = ["coaching", "school", "college", "institute", "academy", "tutor", "university"]

[[type_groups]]
name = "Home & moving services"
travel = false
keywords = ["packers", "movers", "plumber", "electrician", "repair", "pest control", "interior", "interior designer"]

[[type_groups]]
name = "Retail"
travel = false
keywords = ["store", "shop", "showroom", "supermarket", "market"]

[[type_groups]]
name = "Beauty & wellness"
travel = false
keywords = ["salon", "spa", "parlour", "gym", "fitness"]

[[type_groups]]
name = "Auto"
travel = false
keywords = ["car", "bike", "motorcycle", "dealer", "garage", "service center"]
