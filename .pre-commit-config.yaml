# Install once: pre-commit install   (see README "Contributing")
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: reviewring-leakcheck
        name: ReviewRing fixture leak check
        entry: uv run --project backend python -m reviewring.leakcheck fixtures
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff
        name: ruff (backend)
        entry: uv run --project backend ruff check backend
        language: system
        pass_filenames: false
        files: ^backend/
